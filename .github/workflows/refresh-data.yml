name: Refresh data

# Offers every other day; neighbourhood facts (OpenStreetMap) on the 1st of the month or on request.
on:
  schedule:
    - cron: "17 5 */2 * *" # 06:17 CET / 07:17 CEST on odd days of the month
  workflow_dispatch:
    inputs:
      amenities:
        description: "Also refresh neighbourhood facts from OpenStreetMap (slow, ~15 min)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tests
        run: uv run pytest -q
      - name: Scrape portals
        run: uv run scripts/scrape.py
      - name: Neighbourhood facts (on request, or on the 1st of the month)
        if: ${{ inputs.amenities || github.event_name == 'schedule' }}
        run: |
          if [ "${{ inputs.amenities }}" = "true" ] || [ "$(date -u +%d)" = "01" ]; then
            uv run scripts/amenities.py --refresh || echo "::warning::amenities refresh failed, keeping old data"
          else
            echo "not the 1st – skipped"
          fi
      - name: Build pages
        run: uv run scripts/build.py
      - name: Commit if changed
        run: |
          git config user.name "thomascamminady"
          git config user.email "24543638+thomascamminady@users.noreply.github.com"
          git add data/feed.json data/amenities.json offers.html overview.html index.html data/listings.csv
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Refresh data $(date -u +%F)"
          git push
